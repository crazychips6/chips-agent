services:
  chips:
    build: .
    ports:
      - "8648:8648"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - CHIPS_MODEL=${CHIPS_MODEL:-deepseek-chat}
      - CHIPS_BASE_URL=${CHIPS_BASE_URL:-https://api.deepseek.com}
      - CHIPS_WEB_USER=${CHIPS_WEB_USER:-admin}
      - CHIPS_WEB_PASS=${CHIPS_WEB_PASS:-admin}
      - CHIPS_WEB_SECRET=${CHIPS_WEB_SECRET:-change-me-in-production}
    volumes:
      - ./.memory:/app/.memory
      - ./.chips:/app/.chips
      - ./skills:/app/skills

  prometheus:
    image: prom/prometheus:latest
    container_name: chips-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: chips-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
