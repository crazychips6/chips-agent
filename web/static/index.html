<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chips Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.6/marked.min.js"></script>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #1f3a6b;
    --text: #e0e0e0;
    --text-dim: #8892a0;
    --accent: #64ffda;
    --danger: #ff6b6b;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* 登录 */
  #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 16px; }
  #login-screen.hidden { display: none; }
  #login-screen input { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--surface2); background: var(--surface); color: var(--text); font-size: 16px; width: 280px; outline: none; }
  #login-screen input:focus { border-color: var(--accent); }
  #login-screen button { padding: 12px 32px; border-radius: var(--radius); border: none; background: var(--accent); color: #1a1a2e; font-size: 16px; font-weight: 600; cursor: pointer; }
  #login-error { color: var(--danger); font-size: 14px; }

  /* 头部 */
  #header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--surface2); display: flex; justify-content: space-between; align-items: center; }
  #header h1 { font-size: 18px; font-weight: 600; }
  #header .sub { color: var(--text-dim); font-size: 12px; }
  #logout-btn { background: none; border: 1px solid var(--surface2); color: var(--text-dim); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  #logout-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* 聊天 */
  #chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 15px; }
  .msg.user { background: var(--surface2); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--surface); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.assistant.streaming { border-left: 2px solid var(--accent); }
  .msg.error { background: #3d1f1f; align-self: center; color: var(--danger); font-size: 13px; }

  /* Markdown */
  .msg p { margin: 4px 0; }
  .msg p:first-child { margin-top: 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { padding-left: 20px; margin: 4px 0; }
  .msg table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 14px; }
  .msg th, .msg td { border: 1px solid var(--surface2); padding: 6px 10px; text-align: left; }
  .msg th { background: var(--surface2); font-weight: 600; }
  .msg blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: var(--text-dim); }
  .msg a { color: var(--accent); text-decoration: underline; }

  /* 代码块 */
  .msg pre { position: relative; background: #0d1117; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .msg pre code { background: none; padding: 0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.5; }
  .msg code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
  .msg pre code { background: none; padding: 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; background: var(--surface2); color: var(--text-dim); border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
  .msg pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--accent); color: #1a1a2e; }
  .copy-btn.copied { background: var(--accent); color: #1a1a2e; opacity: 1; }

  /* 加载动画 */
  .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
  .typing-dot { width: 8px; height: 8px; background: var(--text-dim); border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

  /* 输入 */
  #input-area { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--surface2); display: flex; gap: 10px; }
  #input-area textarea { flex: 1; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--surface2); background: var(--bg); color: var(--text); font-size: 15px; resize: none; outline: none; min-height: 48px; max-height: 120px; font-family: inherit; }
  #input-area textarea:focus { border-color: var(--accent); }
  #input-area button { padding: 12px 24px; border-radius: var(--radius); border: none; background: var(--accent); color: #1a1a2e; font-weight: 600; cursor: pointer; font-size: 15px; white-space: nowrap; }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="login-screen">
  <h2 style="margin-bottom:8px">chips</h2>
  <input id="login-user" type="text" placeholder="用户名">
  <input id="login-pass" type="password" placeholder="密码" >
  <div id="login-error"></div>
  <button onclick="login()">登录</button>
</div>

<div id="chat-screen" class="hidden">
  <div id="header">
    <div><h1>chips</h1><span class="sub">connected</span></div>
    <button id="logout-btn" onclick="logout()">退出</button>
  </div>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button id="send-btn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('token') || '';
let currentMsg = null;

if (token) initChat();

async function login() {
  const username = document.getElementById('login-user').value;
  const password = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    if (!r.ok) { errEl.textContent = '登录失败'; return; }
    const data = await r.json();
    token = data.access_token;
    localStorage.setItem('token', token);
    initChat();
  } catch (e) { errEl.textContent = '网络错误'; }
}

function logout() {
  token = '';
  localStorage.removeItem('token');
  document.getElementById('chat-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

function initChat() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('chat-screen').classList.remove('hidden');
  document.getElementById('input').focus();
}

function addMessage(role, content, streaming=false) {
  const el = document.createElement('div');
  el.className = 'msg ' + role + (streaming ? ' streaming' : '');

  if (role === 'assistant' && content && !streaming) {
    el.innerHTML = marked.parse(content);
    el.querySelectorAll('pre code').forEach(block => {
      hljs.highlightElement(block);
      const wrapper = block.parentElement;
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = '复制';
      btn.onclick = () => {
        navigator.clipboard.writeText(block.textContent).then(() => {
          btn.textContent = '已复制!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
        });
      };
      wrapper.appendChild(btn);
    });
  } else if (streaming && content) {
    el.textContent = content;
  } else {
    el.textContent = content;
  }

  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior: 'smooth'});
  return el;
}

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;

  addMessage('user', msg);

  const msgEl = addMessage('assistant', '', true);
  let buffer = '';

  try {
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify({message: msg}),
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let partial = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      partial += decoder.decode(value, {stream: true});
      const lines = partial.split('\n');
      partial = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            buffer += parsed.token;
            msgEl.textContent = buffer;
            msgEl.scrollIntoView({behavior: 'smooth'});
          } catch (e) {}
        }
      }
    }
  } catch (e) {
    msgEl.textContent = '[连接错误]';
    msgEl.className = 'msg error';
  }

  // 流式结束后用 Markdown 渲染
  if (buffer) {
    msgEl.classList.remove('streaming');
    msgEl.innerHTML = marked.parse(buffer);
    msgEl.querySelectorAll('pre code').forEach(block => {
      hljs.highlightElement(block);
      const wrapper = block.parentElement;
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = '复制';
      btn.onclick = () => {
        navigator.clipboard.writeText(block.textContent).then(() => {
          btn.textContent = '已复制!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
        });
      };
      wrapper.appendChild(btn);
    });
  }

  btn.disabled = false;
  document.getElementById('input').focus();
}

// Auto-resize textarea
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
