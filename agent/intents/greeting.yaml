# greeting 意图 — 问候打招呼
name: greeting
model: small
tools: []
description: |
  简单问候和打招呼。典型场景：
  - 用户说"你好"、"Hi"、"早上好"
  - 纯粹的社交性问候，不需要工具
  关键特征：问候词（你好、Hi、Hello、在吗）
tool_priorities: {}
keywords:
  - 你好
  - 您好
  - hi
  - hello
  - 早上好
  - 晚上好
  - 在吗
  - 嗨
# 规则预过滤（不走 LLM）
rules:
  - type: exact        # 精确匹配
    values:
      - 你好
      - 您好
      - hi
      - hello
      - 在吗
      - 嗨
  - type: prefix       # 前缀匹配
    values:
      - 早上好
      - 下午好
      - 晚上好
      - 你好啊
      - 您好啊
  - type: regex        # 正则匹配
    pattern: "^(hi|hello|hey)[!！.。]?$"
