# complex 意图 — 复杂分析
name: complex
model: large
tools: "all"
description: |
  需要多步骤协作的复杂任务。典型场景：
  - 需要同时查资料和写代码
  - 需要操作多个独立文件或模块
  - 需要先调研再做决策
  关键特征：包含分析词（分析、比较、评估）、设计词（方案、架构、设计）
tool_priorities:
  file: 0.8
  exec: 0.7
  web: 0.6
  orchestrate: 0.9
keywords:
  - 分析
  - 比较
  - 对比
  - 评估
  - 方案
  - 设计
  - 架构
prompt_hint: |
  当前任务看起来需要多个步骤。如果涉及以下情况，请使用 orchestrate 工具：
    - 需要同时查资料和写代码
    - 需要操作多个独立文件或模块
    - 可以用多个角色并行工作（研究员查资料 + 程序员实现）
    - 需要先调研再做决策
# 规则预过滤
rules:
  - type: contains
    values:
      - 帮我分析
      - 帮我比较
      - 帮我对比
      - 帮我评估
      - 设计方案
      - 架构设计
