# complex 意图 — 复杂分析
name: complex
model: large
tools: "all"
keywords:
  - 分析
  - 比较
  - 对比
  - 评估
  - 方案
  - 设计
  - 架构
prompt_hint: |
  当前任务看起来需要多个步骤。如果涉及以下情况，请使用 orchestrate 工具：
    - 需要同时查资料和写代码
    - 需要操作多个独立文件或模块
    - 可以用多个角色并行工作（研究员查资料 + 程序员实现）
    - 需要先调研再做决策
# 规则预过滤
rules:
  - type: contains
    values:
      - 帮我分析
      - 帮我比较
      - 帮我对比
      - 帮我评估
      - 设计方案
      - 架构设计
