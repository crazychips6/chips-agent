# document 意图 — 文档处理
name: document
model: large
tools:
  - document
  - file
description: |
  解析和提取文档内容。典型场景：
  - 用户要读取 PDF、DOCX、TXT 等文档
  - 用户要提取文档中的文字
  - 用户要对文档做 OCR 识别
  关键特征：包含文件扩展名（.pdf, .docx）、文档操作词（解析、提取、OCR）
tool_priorities:
  document: 1.0
  file: 0.6
keywords:
  - .pdf
  - .docx
  - .doc
  - .txt
  - .eml
  - .msg
  - 文档
  - 文件
  - 解析
  - 提取
  - OCR
  - 识别
  - 读取
  - 打开
prompt_hint: |
  当前任务涉及文档处理，请使用 document 工具：
    - document(action='read', path='...') — 提取文档文本
    - document(action='info', path='...') — 获取元信息
    - document(action='ocr', path='...') — 图片 OCR
    - document(action='convert', path='...') — PDF 转 Markdown
  不要使用 bash 或其他工具处理文档。
# 规则预过滤
rules:
  - type: regex
    pattern: "\\.(pdf|docx|doc|txt|eml|msg|png|jpg|jpeg)(\\s|$)"
  - type: contains
    values:
      - 帮我看看这个文档
      - 解析这个文档
      - 读取这个文件
      - 打开这个文件
      - 提取文本
      - 识别文字
      - OCR识别
