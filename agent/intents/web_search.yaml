# web_search 意图 — 需要搜索网页
name: web_search
model: large
tools: "all"
description: |
  搜索互联网获取最新信息。典型场景：
  - 用户问"今天天气怎么样"
  - 用户问"最新科技新闻"
  - 用户问"Python 3.12 有什么新特性"
  关键特征：包含时间词（今天、最新）、搜索动作词（查一下、搜一下）
tool_priorities:
  web: 1.0
  fetch: 0.8
  file: 0.2
keywords:
  - 现在
  - 最新
  - 最近
  - 流行
  - 今天
  - 昨天
  - 明天
  - 搜索
  - 查一下
  - 找一下
time_sensitive: true
# 规则预过滤
rules:
  - type: contains      # 包含匹配
    values:
      - 搜索一下
      - 查一下
      - 帮我搜
      - 帮我查
      - 搜索最新
      - 最新消息
      - 今天的
      - 昨天的
      - 明天的
