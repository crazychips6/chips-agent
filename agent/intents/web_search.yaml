# web_search 意图 — 需要搜索网页
name: web_search
model: large
tools: "all"
keywords:
  - 现在
  - 最新
  - 最近
  - 流行
  - 今天
  - 昨天
  - 明天
  - 搜索
  - 查一下
  - 找一下
time_sensitive: true
# 规则预过滤
rules:
  - type: contains      # 包含匹配
    values:
      - 搜索一下
      - 查一下
      - 帮我搜
      - 帮我查
      - 搜索最新
      - 最新消息
      - 今天的
      - 昨天的
      - 明天的
