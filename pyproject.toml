[project]
name = "chips"
version = "0.3.0"
description = "A general-purpose agent harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "prometheus-client>=0.21.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.0.1",
    "rich>=13.0.0",
    "textual>=1.0.0",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
observability = ["langfuse>=2.0.0"]
document = [
    "pymupdf4llm>=0.18.0",
    "python-docx>=1.1.0",
    "chardet>=7.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "extract-msg>=0.41.0",
]

[project.scripts]
chips = "agent.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "config*",
    "tool*",
    "safety*",
    "environment*",
    "session*",
    "memory*",
    "gateway*",
    "plugins*",
    "web*",
    "knowledge*",
    "rules*",
    "endpoint*",
    "utils*",
    "test*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
