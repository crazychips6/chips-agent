[project]
name = "chips"
version = "0.1.0"
description = "A general-purpose agent harness"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
chips = "agent.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "tool*",
    "safety*",
    "environment*",
    "session*",
    "memory*",
    "test*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
