<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- 芯片 -->
  <rect x="110" y="110" width="180" height="180" rx="28" fill="url(#g)" opacity="0.12"/>
  <rect x="125" y="125" width="150" height="150" rx="20" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- C 形电路 -->
  <path d="M155 170 H195 A25 25 0 0 1 220 195 V205 A25 25 0 0 1 195 230 H155"
        fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>

  <!-- 信号点 -->
  <circle cx="155" cy="170" r="4" fill="#06b6d4"/>
  <circle cx="155" cy="230" r="4" fill="#06b6d4"/>

  <!-- 引脚 -->
  <line x1="125" y1="175" x2="95" y2="175" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="200" x2="95" y2="200" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="225" x2="95" y2="225" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="275" y1="175" x2="305" y2="175" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="275" y1="200" x2="305" y2="200" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="275" y1="225" x2="305" y2="225" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 底部引脚 -->
  <line x1="175" y1="275" x2="175" y2="305" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="275" x2="200" y2="305" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="225" y1="275" x2="225" y2="305" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
