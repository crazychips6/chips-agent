# chips Agent 路由规则（默认配置）
#
# 规则按 priority 降序匹配，第一条命中的规则生效。
# 所有规则均未命中时走默认行为：direct（主 Agent 直接处理）。
#
# 自定义规则请写入 ~/.chips/routing.yaml，同名规则会覆盖默认规则。
# 修改此文件会在下次升级时被覆盖。

rules:

  # ── 安全类规则（最高优先级，拦截危险操作） ──

  - name: "block_emergency_stop"
    priority: 5000
    when:
      intent_keyword: { in: ["紧急停止", "emergency_stop", "立即停止"] }
    then: block
    reason: "用户请求紧急停止，拦截当前操作"

  # ── 能力类规则（路由到 Specialist Agent） ──

  - name: "research_trigger"
    priority: 150
    when:
      intent_keyword: { in: ["research"] }
    then: delegate(researcher)
    reason: "检测到搜索/调研意图，委派给 Researcher Agent"

  - name: "coding_trigger"
    priority: 140
    when:
      intent_keyword: { in: ["coding"] }
    then: delegate(coder)
    reason: "检测到编程意图，委派给 Coder Agent"

  # ── 效率类规则（仅当能力类规则未命中时） ──

  - name: "short_reply_skip"
    priority: 50
    when:
      is_short_reply: { eq: true }
    then: direct
    reason: "短回复，直接由主 Agent 处理"

  - name: "single_question_skip"
    priority: 40
    when:
      all:
        - message_length: { lte: 40 }
        - question_count: { lte: 1 }
    then: direct
    reason: "单个简单问题，不需要路由"

  # ── 复杂任务触发 LLM Router（兜底） ──

  - name: "long_complex_trigger"
    priority: 20
    when:
      all:
        - message_length: { gte: 200 }
        - has_code_block: { eq: false }
    then: llm_router
    reason: "长消息且不含代码块，可能需要深度分析"

  - name: "cross_domain_trigger"
    priority: 15
    when:
      task_complexity_signals: { match: "'cross_domain': True" }
    then: llm_router
    reason: "检测到跨领域需求，需要 LLM Router 分析"
